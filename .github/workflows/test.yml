name: Tests

# Runs on every push and pull request so "tests pass" (the branch policy
# precondition in ROADMAP.md Section 1.1) is enforced automatically rather
# than relying on a contributor to remember to run pytest locally.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v
